<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detallito para mi &lt;3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;

    /* Paleta clara (cálida) */
    --bg-1: #fff4ec;
    --bg-2: #ffe3d3;
    --bg-3: #ffdce6;
    --card-bg: rgba(255, 255, 255, 0.72);
    --card-border: rgba(255, 255, 255, 0.9);
    --text: #4a3b42;
    --text-soft: #8a7079;
    --accent: #ff8a5c;
    --accent-2: #ff6f91;
    --accent-ink: #ffffff;
    --shadow: rgba(255, 138, 92, 0.28);
    --star: rgba(255, 170, 120, 0.55);
    --focus: #6c5ce7;
    --chip: rgba(255, 138, 92, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #241824;
      --bg-2: #2d1b2e;
      --bg-3: #1c1626;
      --card-bg: rgba(48, 34, 52, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f3e9ee;
      --text-soft: #c2a9b6;
      --accent: #ff9a6c;
      --accent-2: #ff7fa4;
      --accent-ink: #2a1720;
      --shadow: rgba(0, 0, 0, 0.45);
      --star: rgba(255, 200, 160, 0.5);
      --focus: #b7a7ff;
      --chip: rgba(255, 154, 108, 0.16);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Quicksand", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--bg-2), transparent 60%),
      radial-gradient(1000px 500px at 110% 20%, var(--bg-3), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    overflow-x: hidden;
    position: relative;
  }

  /* Estrellitas / destellos sutiles */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    color: var(--star);
    font-size: 14px;
    opacity: 0.7;
    animation: twinkle 4s ease-in-out infinite;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 36px 28px 40px;
    border-radius: 28px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: 0 24px 60px -20px var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .brand {
    margin: 0 0 14px;
    font-family: "Fredoka", "Quicksand", sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.9;
  }

  .greeting {
    font-family: "Fredoka", "Quicksand", sans-serif;
    font-weight: 600;
    font-size: clamp(1.3rem, 5vw, 1.7rem);
    margin: 0 0 4px;
    color: var(--text);
  }

  .subtitle {
    margin: 0 0 24px;
    font-size: 0.98rem;
    color: var(--text-soft);
    font-weight: 500;
  }

  /* Disco de vinilo */
  .disc {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, var(--accent-2) 0 14%, transparent 15%),
      repeating-radial-gradient(circle at 50% 50%, #0000 0 3px, rgba(0,0,0,0.12) 3px 4px),
      linear-gradient(135deg, #2a2230, #43384a);
    box-shadow: 0 10px 24px -10px var(--shadow), inset 0 0 0 2px rgba(255,255,255,0.06);
    animation: spin 8s linear infinite;
    animation-play-state: paused;
  }
  .disc.playing { animation-play-state: running; }
  .disc::after {
    content: "";
    position: absolute;
  }

  .song {
    margin: 0 0 26px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .song.show { animation: pop 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); }

  .fragment {
    font-family: "Fredoka", "Quicksand", sans-serif;
    font-weight: 500;
    font-size: clamp(1.15rem, 4.6vw, 1.45rem);
    line-height: 1.45;
    margin: 0;
    max-width: 32ch;
    color: var(--text);
    white-space: pre-line;
  }

  .meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-weight: 600;
  }
  .meta .title { font-size: 1rem; color: var(--text); }
  .meta .artist { font-size: 0.9rem; color: var(--text-soft); font-weight: 500; }

  .nota {
    margin: 0;
    font-size: 0.9rem;
    font-style: italic;
    color: var(--text-soft);
    max-width: 32ch;
  }
  .nota:empty { display: none; }

  .listen {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--accent);
    background: var(--chip);
    padding: 8px 16px;
    border-radius: 999px;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .listen:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .listen:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .listen[hidden] { display: none; }

  .acciones {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .acciones:not(:has(:not([hidden]))) { display: none; }

  .share {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--accent);
    background: var(--chip);
    border: none;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 999px;
    transition: transform 0.15s ease, filter 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .share:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .share:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .share[hidden] { display: none; }
  .share.feedback { animation: pop 0.3s ease; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .btn {
    font-family: "Fredoka", "Quicksand", sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--accent-ink);
    border: none;
    cursor: pointer;
    padding: 16px 34px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 12px 26px -8px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 18px 32px -10px var(--shadow); }
  .btn:active { transform: translateY(1px) scale(0.98); box-shadow: 0 8px 18px -8px var(--shadow); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .footer {
    margin-top: 20px;
    font-size: 0.8rem;
    color: var(--text-soft);
    font-weight: 500;
    opacity: 0.85;
  }

  @keyframes pop {
    0%   { opacity: 0; transform: scale(0.96) translateY(6px); }
    60%  { opacity: 1; transform: scale(1.02) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50%      { opacity: 0.9;  transform: scale(1.15); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Respeta a quien prefiere menos movimiento */
  @media (prefers-reduced-motion: reduce) {
    .song.show { animation: none; }
    .star { animation: none; }
    .disc { animation: none; }
    .share.feedback { animation: none; }
    .btn, .listen, .share { transition: none; }
    .btn:hover, .btn:active, .listen:hover, .share:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="card">
    <p class="brand">Detallito para mi &lt;3</p>
    <div class="disc" id="disc" aria-hidden="true"></div>
    <h1 class="greeting" id="greeting">Hola Fio</h1>
    <p class="subtitle">Tocá el botón y vas a ver algunas músicas que te dedico</p>

    <figure class="song" id="song" aria-live="polite">
      <blockquote class="fragment" id="fragment">Acá abajo 👇</blockquote>
      <figcaption class="meta" id="meta" hidden>
        <span class="title" id="title"></span>
        <span class="artist" id="artist"></span>
      </figcaption>
      <p class="nota" id="nota"></p>
      <div class="acciones">
        <a class="listen" id="listen" target="_blank" rel="noopener noreferrer" hidden>▶ Escuchar</a>
        <button type="button" class="share" id="share" aria-label="Compartir enlace de la canción" hidden>🔗 Compartir</button>
      </div>
    </figure>

    <div class="sr-only" id="shareStatus" role="status" aria-live="polite"></div>

    <button class="btn" id="btn" type="button" aria-label="Dedicame una canción">🎧</button>
  </main>

<script>
  // 👇 Editá o agregá tus canciones acá.
  //    En "fragmento" pegá EL VERSO que elegiste vos (tu parte favorita).
  //    "link" puede ser de Spotify, YouTube, Apple Music, lo que quieras (dejalo "" si no querés botón).
  //    "nota" es opcional: tu mensajito ("escuchá el 2:14", "me acordé de vos acá", etc.).
  const CANCIONES = [
    {
      fragmento: "«Ser música de la que prefieres\nY que nunca me quieras pausar»",
      cancion: "Patadas de Ahogado",
      artista: "LATIN MAFIA, HUMBE",
      link: "https://open.spotify.com/intl-es/track/4WefXOf8I4gMjdj2kBJgkl",
      nota: "Quiero poder ser la música que tengas en bucle siempre",
    },
    {
      fragmento: "«No paro de sobrepensar,\nsolo quiero verte y besarte\nhasta que no des más»",
      cancion: "en una",
      artista: "Ramma",
      link: "https://open.spotify.com/intl-es/track/0uyNidfw8146ufKeBOSiHu",
      nota: "Resume mi día a día; quiero verte en todo momento y que en esos momentos seamos solo nosotros 2",
    },
    {
      fragmento: "«Porque ya me cansé\nde que solo me veas como amigo.\nQuiero ser algo más»",
      cancion: "VEGAS",
      artista: "HUMBE",
      link: "https://open.spotify.com/intl-es/track/1ECh4D3MzgNUdXsKE0eThN",
      nota: "Bueno mucha explicación no hay simplemente lo que dice el verso",
    },
    {
      fragmento: "«Yo quiero mil vidas contigo»",
      cancion: "MIL VIDAS",
      artista: "Mora, Ryan Castro",
      link: "https://open.spotify.com/intl-es/track/4mIlk7LzrD260sNOY4hbtS",
      nota: "Quiero que esto funcione y por más complicadas que se pongan las cosas quiero mil vidas contigo",
    },
  ];

  // Dejá vacío ("") para un saludo neutro, o poné un nombre: const NOMBRE = "Sofi";
  const NOMBRE = "Fio";

  // ---- De acá para abajo no hace falta tocar nada ----

  const greetingEl = document.getElementById("greeting");
  const songEl = document.getElementById("song");
  const fragmentEl = document.getElementById("fragment");
  const metaEl = document.getElementById("meta");
  const titleEl = document.getElementById("title");
  const artistEl = document.getElementById("artist");
  const notaEl = document.getElementById("nota");
  const listenEl = document.getElementById("listen");
  const shareEl = document.getElementById("share");
  const shareStatusEl = document.getElementById("shareStatus");
  const btn = document.getElementById("btn");
  const disc = document.getElementById("disc");

  greetingEl.textContent = NOMBRE.trim() ? "Hola " + NOMBRE.trim() : "Hola";

  let ultimoIndice = -1;
  let cancionActual = null;
  const TEXTO_SHARE = shareEl.textContent;
  let shareTimer = null;
  let anuncioTimer = null;

  function cancionAlAzar() {
    if (CANCIONES.length === 0) return null;
    if (CANCIONES.length === 1) return 0;
    let i;
    do {
      i = Math.floor(Math.random() * CANCIONES.length);
    } while (i === ultimoIndice);
    ultimoIndice = i;
    return i;
  }

  function dedicar() {
    const idx = cancionAlAzar();
    if (idx === null) return;
    const c = CANCIONES[idx];
    cancionActual = c;

    fragmentEl.textContent = c.fragmento || "";

    const tieneMeta = (c.cancion && c.cancion.trim()) || (c.artista && c.artista.trim());
    metaEl.hidden = !tieneMeta;
    titleEl.textContent = c.cancion || "";
    artistEl.textContent = c.artista || "";

    notaEl.textContent = c.nota || "";

    if (c.link && c.link.trim()) {
      listenEl.href = c.link.trim();
      listenEl.hidden = false;
    } else {
      listenEl.hidden = true;
      listenEl.removeAttribute("href");
    }

    resetShare();
    shareEl.hidden = !(c.link && c.link.trim());

    disc.classList.add("playing");

    songEl.classList.remove("show");
    void songEl.offsetWidth; // reinicia la animación en toques seguidos
    songEl.classList.add("show");
  }

  function resetShare() {
    clearTimeout(shareTimer);
    clearTimeout(anuncioTimer);
    shareTimer = null;
    anuncioTimer = null;
    shareEl.textContent = TEXTO_SHARE;
    shareEl.classList.remove("feedback");
    shareStatusEl.textContent = "";
  }

  function mostrarFeedback(texto) {
    clearTimeout(shareTimer);
    clearTimeout(anuncioTimer);
    shareEl.textContent = texto;
    shareEl.classList.remove("feedback");
    void shareEl.offsetWidth;
    shareEl.classList.add("feedback");
    shareStatusEl.textContent = "";
    // vaciar y volver a escribir para que se anuncie también en toques seguidos
    anuncioTimer = setTimeout(() => { shareStatusEl.textContent = texto; }, 50);
    shareTimer = setTimeout(resetShare, 2000);
  }

  function copiarConTextarea(texto) {
    const ta = document.createElement("textarea");
    ta.value = texto;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, texto.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    shareEl.focus({ preventScroll: true });
    return ok;
  }

  async function copiar(texto) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(texto);
        return true;
      } catch (e) { /* cae al fallback */ }
    }
    return copiarConTextarea(texto);
  }

  async function compartir() {
    if (!cancionActual) return;
    const link = (cancionActual.link || "").trim();
    if (!link) return;

    const esTactil = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    if (navigator.share && esTactil) {
      const titulo = [cancionActual.cancion, cancionActual.artista]
        .filter((x) => x && x.trim()).join(" — ");
      try {
        await navigator.share({ title: titulo, text: cancionActual.fragmento || "", url: link });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
        // otro error: cae a copiar
      }
    }
    mostrarFeedback((await copiar(link)) ? "¡Copiado! ✓" : "No se pudo copiar");
  }

  shareEl.addEventListener("click", compartir);
  btn.addEventListener("click", dedicar);

  // Estrellitas sutiles de fondo
  (function crearEstrellas() {
    const cont = document.querySelector(".stars");
    const simbolos = ["✦", "✧", "♪", "·"];
    const total = 24;
    for (let n = 0; n < total; n++) {
      const s = document.createElement("span");
      s.className = "star";
      s.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.fontSize = (10 + Math.random() * 12) + "px";
      s.style.animationDelay = (Math.random() * 4) + "s";
      s.style.animationDuration = (3 + Math.random() * 3) + "s";
      cont.appendChild(s);
    }
  })();
</script>
</body>
</html>
